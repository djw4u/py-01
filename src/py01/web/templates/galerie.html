{% extends "layout.html" %}
{% block content %}
<h1>Galerie</h1>
<p class="filter">Filter:
  <a href="/galerie"{% if filter_id == 0 %} class="active"{% endif %}>Alle</a>
  {% for v in variants %}
  <a href="/galerie?variant={{ v.id }}"{% if v.id == filter_id %} class="active"{% endif %}>{{ v.name }}</a>
  {% endfor %}
</p>
{% if images %}
<ul class="grid">
  {% for img in images %}
  <li>
    <a href="/bilder/{{ img.id }}.svg" target="_blank" rel="noopener">
      <img src="/bilder/{{ img.id }}.svg" alt="Bild {{ img.id }}">
      <span>{{ img.variant_name }} · {{ img.created }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="hint">Keine gespeicherten Bilder.</p>
{% endif %}
{% endblock %}
