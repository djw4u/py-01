<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>py-01 · {{ title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <strong>py-01</strong>
    <a href="/werkstatt"{% if active == "werkstatt" %} class="active"{% endif %}>Werkstatt</a>
    <a href="/galerie"{% if active == "galerie" %} class="active"{% endif %}>Galerie</a>
  </nav>
  <main>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
