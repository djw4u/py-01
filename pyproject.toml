[project]
name = "py-01"
version = "0.1.0"
description = "Lokale Web-App, die aus JSON-Parametern SVG-Bilder erzeugt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flask"]

[project.scripts]
py-01 = "py01.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "py01"

[tool.ruff]
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
